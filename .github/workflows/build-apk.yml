name: Build True Find APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # the GitHub machine already has the Android SDK; only accept its licences
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Calibri look-alike font (Carlito), same as the web app
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Regular.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Regular.ttf || echo "font download failed, the phone's font will be used"
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Bold.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Bold.ttf || true

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file (+ version.json for the app's Update button)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrueFind-test.apk
          echo "{\"versionCode\": ${{ github.run_number }}, \"apk\": \"https://github.com/${{ github.repository }}/releases/download/test-build/TrueFind-test.apk\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: TrueFind-test-apk
          path: TrueFind-test.apk

      # Easy phone download: Releases → "Test build" → TrueFind-test.apk
      - name: Put the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build
          prerelease: true
          make_latest: false
          body: "Latest test APK, built from commit ${{ github.sha }}. Open on the phone, tap TrueFind-test.apk, install."
          files: |
            TrueFind-test.apk
            version.json
