name: Build True Find APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.sets.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      # which emulator photo sets to take this time (ci/sets.json, e.g. ["home","chat"])
      - name: Photo sets
        id: sets
        # a work branch with its own list (ci/sets-<branch>.json) photographs only its own screens
        run: |
          # branch misc-admin-native photographs only its own screens (Control Center + status screens)
          if [ "${{ github.ref_name }}" = misc-admin-native ]; then echo 'list=["misc","admin"]' >> "$GITHUB_OUTPUT"; exit 0; fi
          f="ci/sets-${{ github.ref_name }}.json"; [ -f "$f" ] || f=ci/sets.json
          echo "list=$(cat "$f" 2>/dev/null || echo '["home","chat"]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # the GitHub machine already has the Android SDK; only accept its licences
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Calibri look-alike font (Carlito), same as the web app
        run: |
          mkdir -p app/src/main/assets/fonts
          for f in Regular Bold BoldItalic; do
            curl -fsSL -o app/src/main/assets/fonts/Carlito-$f.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-$f.ttf || echo "font $f download failed, the phone's font will be used"
          done

      # notifications while the app is closed (Firebase): the app's Firebase file comes from the repo secret
      # GOOGLE_SERVICES_JSON (Settings → Secrets → Actions). Without it the APK is built without them.
      - name: Firebase file (notifications)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; echo "Firebase on"; else echo "No GOOGLE_SERVICES_JSON secret: built without notifications"; fi

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      # the Play Store build (release, -PtfStore=true) must not ask for the install permission that only the test
      # builds' Update button uses (Google Play doesn't allow self-updates); test builds keep it. Checked with the
      # real manifest merge on work branches only, so builds on main stay as quick as before.
      # Android's own checker (lint) on test branches: finds crashes on older phones (calls that need a newer
      # Android), wrong resources and other mistakes. Only reports; never stops the build.
      - name: Android lint report (test branches)
        if: github.ref != 'refs/heads/main'
        run: |
          gradle lintDebug --no-daemon -q || true
          f=app/build/reports/lint-results-debug.txt
          if [ -f "$f" ]; then
            echo "=== LINT SUMMARY ==="; tail -3 "$f"
            echo "=== LINT ERRORS ==="; grep -E "^[^ ].*: Error: " "$f" | head -150 || true
            echo "=== LINT WARNINGS (by id) ==="; grep -oE "Warning: .*\[[A-Za-z]+\]$" "$f" | grep -oE "\[[A-Za-z]+\]$" | sort | uniq -c | sort -rn | head -40 || true
            echo "=== LINT WARNINGS (crash-risk ids) ==="; grep -E "\[(NewApi|InlinedApi|UnspecifiedRegisterReceiverFlag|WrongConstant|Range|ResourceType|MissingPermission|UnsafeOptInUsageError|StaticFieldLeak|HandlerLeak|DiscouragedApi|ObsoleteSdkInt|WebViewApiAvailability|SetJavaScriptEnabled|JavascriptInterface|ExportedReceiver|UnprotectedSMSBroadcastReceiver|MutableImplicitPendingIntent|UnsafeImplicitIntentLaunch)\]" "$f" | head -150 || true
          fi
      - name: Check the Play build has no install permission
        if: github.ref != 'refs/heads/main'
        run: |
          gradle :app:processReleaseManifest -PtfStore=true --no-daemon -q
          rel=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -vi androidtest || true)
          dbg=$(find app/build/intermediates -path '*debug*' -name AndroidManifest.xml | grep -vi androidtest || true)
          echo "Play build manifests:"; echo "$rel"
          [ -n "$rel" ] || { echo "no merged release manifest found"; exit 1; }
          if grep -l REQUEST_INSTALL_PACKAGES $rel; then echo "the Play build still asks for REQUEST_INSTALL_PACKAGES"; exit 1; fi
          grep -q REQUEST_INSTALL_PACKAGES $dbg || { echo "the test build lost REQUEST_INSTALL_PACKAGES (its Update button needs it)"; exit 1; }
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' $rel || { echo "the Play build lost the call service permission"; exit 1; }
          if grep -l 'ACCESS_FINE_LOCATION\|ACCESS_COARSE_LOCATION' $rel; then echo "the Play build still asks for location (no screen uses it)"; exit 1; fi
          echo "OK: Play build without the install permission, test build still with it, call service in both"

      # The file for Google Play (.aab), signed with the upload key from the repo secrets
      # PLAY_UPLOAD_KEYSTORE_B64 (the key file in base64), PLAY_UPLOAD_STORE_PASSWORD, PLAY_UPLOAD_KEY_ALIAS and
      # PLAY_UPLOAD_KEY_PASSWORD. Without these secrets this step is skipped. Made only on main or when run by hand.
      - name: Play Store bundle (.aab)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          KS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          TF_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          TF_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          TF_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "No PLAY_UPLOAD_KEYSTORE_B64 secret yet: Play bundle skipped"; exit 0; fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export TF_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease -PtfStore=true --no-daemon -q
          cp app/build/outputs/bundle/release/app-release.aab TrueFind-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -la TrueFind-play.aab
      - uses: actions/upload-artifact@v4
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && hashFiles('TrueFind-play.aab') != ''
        with:
          name: TrueFind-play-aab
          path: TrueFind-play.aab

      - name: Name the file (+ version.json for the app's Update button)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrueFind-test.apk
          ls -la TrueFind-test.apk
          echo "{\"versionCode\": ${{ github.run_number }}, \"apk\": \"https://github.com/${{ github.repository }}/releases/download/test-build/TrueFind-test.apk\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: TrueFind-test-apk
          path: TrueFind-test.apk

      # the phone APK above carries the call/video engine (Agora) for phones only (ARM); the
      # GitHub test phone is x86_64, so it gets its own copy with that part added too
      - name: Build the test-phone copy (x86_64 added)
        if: github.ref != 'refs/heads/main'
        run: |
          gradle assembleDebug -PtfAllAbis=true --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk TrueFind-emu.apk
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: TrueFind-emu-apk
          path: TrueFind-emu.apk

      # branch home-native only: the jars the Kotlin code is compiled against, kept
      # on the branch "cp-home" so the code can be checked before each push
      - name: Keep the compile jars on branch "cp-home"
        if: github.ref_name == 'home-native' || github.ref_name == 'all-native'
        continue-on-error: true
        run: |
          gradle -I ci/cp.gradle :app:exportCp --no-daemon -q
          cp "$ANDROID_HOME/platforms/android-36/android.jar" cp/ 2>/dev/null || cp "$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar" cp/
          ls -la cp | head -80
          cd cp
          B=cp-home; [ "${{ github.ref_name }}" = all-native ] && B=cp-all
          git init -q && git checkout -q -b "$B"
          git add -A && git -c user.name=ci -c user.email=ci@truefind.local commit -q -m "cp ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$B"

      # only main reaches the phone's Update button; work branches are tested first
      - name: Put the APK on the Releases page
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build
          prerelease: true
          make_latest: false
          body: "Latest test APK, built from commit ${{ github.sha }}. Open on the phone, tap TrueFind-test.apk, install."
          files: |
            TrueFind-test.apk
            version.json

  screens:
    needs: apk
    # liveroom-native: its screens are checked by "Native screens test" (the Home / Map / Chat /
    # Wallet / Games pictures of this job would only overwrite the other branches' "screens-all-…")
    if: github.ref != 'refs/heads/main' && github.ref_name != 'liveroom-native'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.apk.outputs.sets) }}   # emulators side by side: Home screens · Map + Chat screens
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: TrueFind-test-apk
      - uses: actions/download-artifact@v4
        with:
          name: TrueFind-emu-apk
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph the native screens on an Android phone (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/screens.sh TrueFind-emu.apk shots ${{ matrix.set }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.set }}
          path: shots
      # the same pictures on "screens-all-<set>" (easy to read back for checking; the other work
      # branches keep their own "screens-…" names: recent-native → "screens-recent-<set>", so the
      # all-native pictures are never overwritten); the first set also keeps the APK beside them
      - name: Keep the screenshots on a "screens-…" branch
        if: always()
        run: |
          cd shots
          if [ "${{ matrix.set }}" = home ] && [ -f ../TrueFind-test.apk ]; then cp ../TrueFind-test.apk ./TrueFind-all-native.apk; fi
          # a work branch with its own list keeps its pictures on its own "screens-<branch>-<set>" branch
          B=screens-all-${{ matrix.set }}
          [ -f "../ci/sets-${{ github.ref_name }}.json" ] && B="screens-${{ github.ref_name }}-${{ matrix.set }}"
          if [ "${{ github.ref_name }}" = misc-admin-native ]; then B=screens-misc-${{ matrix.set }}; fi
          git init -q && git checkout -q -b "$B"
          echo "${{ github.ref_name }} ${{ github.sha }}" > FROM.txt
          git add -A && git -c user.name=ci -c user.email=ci@truefind.local commit -q -m "screens ${{ github.ref_name }} ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$B"
