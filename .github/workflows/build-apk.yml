name: Build True Find APK

on:
  push:
    branches: [main, games-native]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # the GitHub machine already has the Android SDK; only accept its licences
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Calibri look-alike font (Carlito), same as the web app
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Regular.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Regular.ttf || echo "font download failed, the phone's font will be used"
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Bold.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Bold.ttf || true

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file (+ version.json for the app's Update button)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrueFind-test.apk
          echo "{\"versionCode\": ${{ github.run_number }}, \"apk\": \"https://github.com/${{ github.repository }}/releases/download/test-build/TrueFind-test.apk\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: TrueFind-test-apk
          path: TrueFind-test.apk

      # Easy phone download: Releases → "Test build" → TrueFind-test.apk
      # (only main reaches the phone's Update button; work branches are checked first)
      - name: Put the APK on the Releases page
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build
          prerelease: true
          make_latest: false
          body: "Latest test APK, built from commit ${{ github.sha }}. Open on the phone, tap TrueFind-test.apk, install."
          files: |
            TrueFind-test.apk
            version.json

  # Work branch "games-native": photograph the native game screens on an Android phone (emulator)
  games-screens:
    needs: apk
    if: github.ref == 'refs/heads/games-native'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: TrueFind-test-apk
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph the games
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/games-screens.sh TrueFind-test.apk shots
      - name: What is inside the APK (sizes)
        if: always()
        run: |
          mkdir -p shots
          unzip -l TrueFind-test.apk | sort -k1 -n -r | head -60 > shots/apk-contents.txt || true
          ls -la TrueFind-test.apk >> shots/apk-contents.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-screens
          path: shots
      - name: Keep the pictures on branch "screens-games"
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b screens-games
          echo "${{ github.ref_name }} ${{ github.sha }}" > FROM.txt
          git add -A && git -c user.name=ci -c user.email=ci@truefind.local commit -q -m "games screens ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screens-games
