# TEST ONLY — the native Wallet's work branch: builds a test APK (never sent to
# phones: no release, no Update button) and photographs every Wallet screen on
# an Android emulator. The pictures go to the branch "screens-wallet".
name: Wallet screens (test)

on:
  push:
    branches: [wallet-native]
  workflow_dispatch:

# least rights: the build only reads the repo; only the screenshot job writes (below)
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14.3"
      - name: Calibri look-alike font (Carlito), same as the web app
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Regular.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Regular.ttf || echo "font download failed"
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Bold.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Bold.ttf || true
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk TrueFind-wallet-test.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallet-test-apk
          path: TrueFind-wallet-test.apk

  screens:
    needs: apk
    runs-on: ubuntu-latest
    # write only to keep the pictures on branch "screens-wallet"
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wallet-test-apk
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph the Wallet screens (emulator, made-up data)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/wallet-screens.sh TrueFind-wallet-test.apk shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wallet-screens
          path: shots
      - name: Keep the pictures on branch "screens-wallet"
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b screens-wallet
          echo "${{ github.ref_name }} ${{ github.sha }}" > FROM.txt
          git add -A && git -c user.name=ci -c user.email=ci@truefind.local commit -q -m "screens wallet ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screens-wallet
