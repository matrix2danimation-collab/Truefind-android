name: Push test (calls and messages with the app closed)

# Does a call ring and a message show while True Find is CLOSED — on every Android version from
# 8.0 to 16? ci/push-test.sh on one emulator per version, side by side. Each version's result
# (result.txt + pictures) is kept on the branch "push-test-api<version>".
# Work branch only; main never runs it (nothing here reaches the phone's Update button).
on:
  push:
    branches: ["fcm-fix"]
  workflow_dispatch:
    inputs:
      apis:
        description: "Android API levels to test (JSON list)"
        default: "[26, 28, 29, 30, 31, 33, 34, 35, 36]"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Firebase file (notifications)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; echo "Firebase on"; else echo "No GOOGLE_SERVICES_JSON secret"; exit 1; fi
      # the test APK with the emulator's processor (x86_64) included
      - name: Build
        run: gradle assembleDebug -PtfAllAbis=true --no-daemon -q
      - run: cp app/build/outputs/apk/debug/app-debug.apk TrueFind-emu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: push-test-apk
          path: TrueFind-emu.apk

  test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # Android 8.0, 9, 10, 11, 12, 13, 14, 15, 16
        api: ${{ fromJSON(github.event.inputs.apis || '[26, 28, 29, 30, 31, 33, 34, 35, 36]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: push-test-apk
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Calls and messages with the app closed (emulator, Android API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/push-test.sh TrueFind-emu.apk out
      - name: Keep the result on "push-test-api${{ matrix.api }}"
        if: always()
        run: |
          mkdir -p out && cd out
          B=push-test-api${{ matrix.api }}
          git init -q && git checkout -q -b "$B"
          echo "${{ github.ref_name }} ${{ github.sha }}" > FROM.txt
          git add -A && git -c user.name=ci -c user.email=ci@truefind.local commit -q -m "push test API ${{ matrix.api }} ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$B"
