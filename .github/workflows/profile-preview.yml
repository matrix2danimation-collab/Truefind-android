# TEST ONLY — the native Wallet's work branch: builds a test APK (never sent to
# phones: no release, no Update button) and photographs every Wallet screen on
# an Android emulator. The pictures go to the branch "screens-profile".
name: Profile screens (preview)

on:
  push:
    branches: [profile-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Calibri look-alike font (Carlito), same as the web app
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Regular.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Regular.ttf || echo "font download failed"
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Bold.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Bold.ttf || true
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk TrueFind-wallet-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-test-apk
          path: TrueFind-wallet-test.apk

  screens:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wallet-test-apk
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph the Wallet screens (emulator, made-up data)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/profile-preview.sh TrueFind-wallet-test.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-screens
          path: shots
      - name: Keep the pictures on branch "screens-profile"
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b screens-profile
          echo "${{ github.ref_name }} ${{ github.sha }}" > FROM.txt
          git add -A && git -c user.name=ci -c user.email=ci@truefind.local commit -q -m "screens wallet ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screens-profile
