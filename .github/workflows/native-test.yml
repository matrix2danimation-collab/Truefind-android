name: Native screens test (no release)

# Test branches only (claude/..., all-native, liveroom-native): builds the app, opens every native
# Live Dance and Live Rooms screen on an Android emulator with a pretend server and saves pictures of them.
# Nothing is published: the phone's Update button and the Releases page are not touched.
on:
  push:
    branches: ["claude/**", "all-native", "liveroom-native"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Calibri look-alike font (Carlito), same as the main build
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Regular.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Regular.ttf || true
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Bold.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Bold.ttf || true

      - name: Agora versions on Maven Central (for the record)
        run: curl -fsSL https://repo1.maven.org/maven2/io/agora/rtc/full-rtc-basic/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -20 || true

      - name: Compile (app + tests)
        run: gradle compileDebugKotlin compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Phone APK (ARM, like the real build) and its size
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TrueFind-native-test.apk
          ls -l TrueFind-native-test.apk
          echo "APK bytes: $(stat -c %s TrueFind-native-test.apk)"
          unzip -l TrueFind-native-test.apk | grep -E "\.so$" || true
          unzip -l TrueFind-native-test.apk | tail -1

      - name: APK size with other packing choices (measured, for the report)
        run: |
          size() { if gradle assembleDebug --no-daemon -q "$@" > /dev/null; then echo "$(stat -c %s app/build/outputs/apk/debug/app-debug.apk) bytes  ($*)"; else echo "build failed ($*)"; fi; }
          size -PtfPackedLibs=false
          size -PtfAbis=arm64-v8a
          size -PtfAbis=armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: TrueFind-native-test-apk
          path: TrueFind-native-test.apk

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Calibri look-alike font (Carlito)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Regular.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Regular.ttf || true
          curl -fsSL -o app/src/main/assets/fonts/Carlito-Bold.ttf https://github.com/google/fonts/raw/main/ofl/carlito/Carlito-Bold.ttf || true

      # the emulator, its pictures and two test runs need room: the machine's unused tool kits make space
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          df -h / | tail -1

      - name: Emulator speed-up (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app + the test (with x86_64 for the emulator)
        run: gradle assembleDebug assembleDebugAndroidTest -PtfAllAbis=true --no-daemon

      # memory and disk of this machine every 10 s while the emulator runs (to see why an emulator stops)
      - name: Watch the machine
        run: nohup bash -c 'while true; do echo "$(date -u +%T) $(free -m | awk "/Mem:/{print \"mem used \"\$3\" MB, free \"\$4\" MB\"}") $(free -m | awk "/Swap:/{print \"swap used \"\$3\" MB\"}") $(df -h / | awk "NR==2{print \"disk free \"\$4}")"; sleep 10; done' > /tmp/mon.txt 2>&1 &

      - name: Open every screen on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        # a stuck test or emulator must not eat the whole job: the pictures and the log still come out
        timeout-minutes: 36
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            sleep 20
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            sleep 5
            adb logcat -c || true
            adb shell svc power stayon true || true
            adb shell input keyevent 82 || true
            adb shell wm dismiss-keyguard || true
            nohup adb logcat -v time > logcat-live.txt 2>&1 &
            timeout 25m gradle connectedDebugAndroidTest -PtfAllAbis=true --no-daemon || echo failed > tests-failed.txt
            df -h / | tail -1
            P=$(timeout 20 adb shell pidof app.truefind.android | tr -d '\r'); if [ -n "$P" ]; then timeout 30 adb root; timeout 30 adb wait-for-device; timeout 60 adb shell debuggerd -j "$P" > stacks.txt 2>&1; fi; true
            mkdir -p shots && timeout 180 adb pull /data/local/tmp/tf-shots shots/ || true
            timeout 60 adb logcat -d > logcat.txt || true

      # the pictures also go into the log (small JPEGs as text), so they can be looked at without downloading
      - name: Pictures into the log
        if: always()
        run: |
          which convert || sudo apt-get install -y -qq imagemagick > /dev/null 2>&1 || true
          for f in $(find shots -name '*.png' | sort); do
            n=$(basename "$f" .png)
            convert "$f" -resize 540x -quality 72 "/tmp/$n.jpg" 2>/dev/null || cp "$f" "/tmp/$n.jpg"
            echo "==SHOT $n=="; base64 -w 0 "/tmp/$n.jpg"; echo; echo "==END=="
          done
          echo "---- test notes ----"
          grep -h "TFTEST" logcat.txt 2>/dev/null | head -120 || true
          echo "---- the log kept while the test ran (also when the emulator stopped): test notes, crashes, last lines ----"
          ls -la logcat-live.txt 2>/dev/null || true
          grep -h "TFTEST" logcat-live.txt 2>/dev/null | tail -60 || true
          grep -hE "FATAL EXCEPTION|AndroidRuntime|lowmemorykiller|Fatal signal|ANR in" -A6 logcat-live.txt 2>/dev/null | head -80 || true
          tail -60 logcat-live.txt 2>/dev/null | cut -c1-240 || true
          echo "---- this machine while the emulator ran ----"
          tail -40 /tmp/mon.txt 2>/dev/null || true
          sudo dmesg 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -10 || true
          echo "---- a test still running when time ran out: where its threads stood ----"
          grep -A45 -E '^"(main|Instr: androidx.test.runner.AndroidJUnitRunner)"' stacks.txt 2>/dev/null | head -120 || true
          echo "---- test problems / crashes ----"
          grep -hE "Problems:|nothing to tap|not sent|missing|FATAL EXCEPTION|AndroidRuntime" -A3 logcat.txt 2>/dev/null | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screens
          path: |
            shots/
            logcat.txt
            stacks.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

      - name: Result
        run: test ! -f tests-failed.txt
